<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Rikuy: a brief backed by checked rows</title>
<desc id="desc">Build the real static client and validate its public synthetic demo rows; foreign curator refuses. No live reader or signing activation. The animation repeats. The adjacent transcript provides a static alternative.</desc>
<rect width="100%" height="100%" rx="16" fill="#101827"/>
<path d="M0 54H1000" stroke="#334155"/>
<circle cx="28" cy="27" r="7" fill="#fb7185"/>
<circle cx="52" cy="27" r="7" fill="#fbbf24"/>
<circle cx="76" cy="27" r="7" fill="#34d399"/>
<text x="110" y="34" fill="#e2e8f0" font-family="monospace" font-size="20">Rikuy: a brief backed by checked rows</text>
<g id="frame0" visibility="hidden" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="24">
<animate attributeName="visibility" calcMode="discrete" values="visible;hidden;hidden" keyTimes="0.000000;0.227273;1.000000" dur="22.000s" repeatCount="indefinite"/>
<text x="28" y="94" fill="#6ee7b7" xml:space="preserve">$ node scripts/build.mjs</text>
<text x="28" y="126" fill="#f1f5f9" xml:space="preserve">Built static Rikuy assets; experimental readers remain disabled.</text>
</g>
<g id="frame1" visibility="hidden" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="24">
<animate attributeName="visibility" calcMode="discrete" values="hidden;visible;hidden;hidden" keyTimes="0.000000;0.227273;0.681818;1.000000" dur="22.000s" repeatCount="indefinite"/>
<text x="28" y="94" fill="#6ee7b7" xml:space="preserve">$ node docs/demos/terminal/inspect-demo.mjs</text>
<text x="28" y="126" fill="#f1f5f9" xml:space="preserve">Validated synthetic brief: 2 priorities, 1 decision.</text>
<text x="28" y="158" fill="#f1f5f9" xml:space="preserve">priorities: Verify the source</text>
<text x="28" y="190" fill="#f1f5f9" xml:space="preserve">priorities: Keep unknowns visible</text>
<text x="28" y="222" fill="#f1f5f9" xml:space="preserve">asks: Choose the next bounded step</text>
<text x="28" y="254" fill="#f1f5f9" xml:space="preserve">No graph connection, signing or production data.</text>
</g>
<g id="frame2" visibility="visible" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="24">
<animate attributeName="visibility" calcMode="discrete" values="hidden;visible;visible" keyTimes="0.000000;0.681818;1.000000" dur="22.000s" repeatCount="indefinite"/>
<text x="28" y="94" fill="#6ee7b7" xml:space="preserve">$ node docs/demos/terminal/inspect-demo.mjs reject</text>
<text x="28" y="126" fill="#f1f5f9" xml:space="preserve">Brief identity UNKNOWN</text>
</g>
</svg>
