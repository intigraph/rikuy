name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate repository patch
        run: git diff --check HEAD^ HEAD
      - name: Verify checkout integrity
        run: git fsck --no-dangling
