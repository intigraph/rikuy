name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Provision browser on the disposable CI runner
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
      - run: python3 scripts/test-browser-check.py
      - run: npm run ci
        env:
          RIKUY_TODAY_SCREENSHOTS: ${{ runner.temp }}/today-screens
      - name: Keep the Today phone screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: today-phone-screens
          path: ${{ runner.temp }}/today-screens
          if-no-files-found: ignore

  repository-pendant-source:
    name: Repository pendant source controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned RDF test parser
        run: python3 -m pip install rdflib==7.6.0
      - name: Test copied pointer and publication boundaries
        run: |
          python3 scripts/test-repository-share-query.py
          python3 scripts/test-repository-knowledge.py
          python3 scripts/test-repository-share-publication.py
